<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Interaktif Informatika SMP</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #38bdf8;
    --primary-hover: #0284c7;
    --success: #22c55e;
    --danger: #ef4444;
    --border: #334155;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .app {
    background: var(--card);
    width: 100%;
    max-width: 680px;
    border-radius: 16px;
    padding: 30px;
    border: 1px solid var(--border);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
  }

  .header {
    text-align: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 24px;
  }

  .header h1 {
    color: var(--primary);
    font-size: 26px;
    margin-bottom: 6px;
  }

  .header p {
    color: var(--muted);
    font-size: 14px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--muted);
  }

  input, select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }

  input:focus, select:focus {
    border-color: var(--primary);
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #0f172a;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 10px;
  }

  .btn:hover {
    background: var(--primary-hover);
    color: white;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 600;
  }

  .badge {
    background: #0f172a;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--primary);
  }

  .timer-badge {
    color: #fbbf24;
  }

  .progress-wrap {
    width: 100%;
    height: 8px;
    background: #0f172a;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width 0.3s ease;
  }

  .question-text {
    font-size: 19px;
    line-height: 1.5;
    margin-bottom: 20px;
    font-weight: 600;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .opt-btn {
    background: #0f172a;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: 10px;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
  }

  .opt-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: #172554;
  }

  .opt-btn.correct {
    background: rgba(34, 197, 94, 0.2);
    border-color: var(--success);
    color: #86efac;
  }

  .opt-btn.wrong {
    background: rgba(239, 68, 68, 0.2);
    border-color: var(--danger);
    color: #fca5a5;
  }

  .opt-btn:disabled {
    cursor: not-allowed;
  }

  .exp-box {
    margin-top: 18px;
    padding: 14px;
    border-radius: 8px;
    background: #0f172a;
    border-left: 4px solid var(--primary);
    font-size: 14px;
    line-height: 1.5;
    display: none;
  }

  .result-box {
    text-align: center;
    display: none;
  }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 6px solid var(--primary);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 20px auto;
  }

  .score-circle span {
    font-size: 38px;
    font-weight: bold;
    color: var(--primary);
  }

  .review-list {
    text-align: left;
    margin-top: 24px;
    max-height: 260px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  .review-item {
    background: #0f172a;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 13px;
    line-height: 1.4;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>⚡ KUIS INFORMATIKA SMP</h1>
    <p>Berpikir Komputasional • Sistem Komputer • Literasi Digital</p>
  </div>

  <!-- Layar Awal -->
  <div id="screen-start">
    <div class="form-group">
      <label for="input-nama">Nama Lengkap Siswa</label>
      <input type="text" id="input-nama" placeholder="Contoh: Bil Yeheskiel">
    </div>
    <div class="form-group">
      <label for="input-kelas">Pilih Kelas</label>
      <select id="input-kelas">
        <option value="VII">Kelas VII (7)</option>
        <option value="VIII">Kelas VIII (8)</option>
        <option value="IX">Kelas IX (9)</option>
      </select>
    </div>
    <button class="btn" onclick="startQuiz()">Mulai Mengerjakan</button>
  </div>

  <!-- Layar Kuis -->
  <div id="screen-quiz" class="hidden">
    <div class="top-bar">
      <span class="badge" id="q-counter">Soal 1 / 10</span>
      <span class="badge" id="q-topic">Topik</span>
      <span class="badge timer-badge" id="q-timer">⏱ 25s</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="question-text" id="q-text"></div>
    <div class="options-list" id="opt-container"></div>
    <div class="exp-box" id="exp-box"></div>

    <button class="btn hidden" id="btn-next" onclick="nextQuestion()">Lanjut ➜</button>
  </div>

  <!-- Layar Hasil -->
  <div id="screen-result" class="result-box">
    <h2>🎉 Evaluasi Selesai!</h2>
    <p id="student-info" style="color: var(--muted); margin-top: 6px;"></p>

    <div class="score-circle">
      <span id="final-score">0</span>
      <small style="color: var(--muted);">Poin</small>
    </div>

    <h3 id="grade-text" style="margin-bottom: 8px;"></h3>
    <p id="summary-text" style="font-size: 14px; color: var(--muted);"></p>

    <div class="review-list" id="review-list"></div>

    <button class="btn" onclick="location.reload()" style="margin-top: 20px;">Main Lagi (Acak Soal)</button>
  </div>
</div>

<script>

let questions = [];
let currentIdx = 0;
let score = 0;
let timeLeft = 25;
let timerId;
let answered = false;

let studentName = "";

function shuffleArray(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function startQuiz() {
  studentName = document.getElementById("input-nama").value.trim();
  studentClass = document.getElementById("input-kelas").value;

  if (!studentName) {
